
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemindai Barcode - Om Nana</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  background: #101820;
}

.card {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding: 10px;
  display: flex;
  flex-direction: column;
  background: #101820;
  color: white;
}

h2 {
  margin: 0;
  text-align: center;
  font-size: 20px;
  height: 35px;
  flex-shrink: 0;
}

.card > p {
  margin: 2px 0 6px;
  text-align: center;
  flex-shrink: 0;
}

#reader {
  width: 100%;
  height: 50%;
  min-height: 0;
  flex: 0 0 50%;
  overflow: hidden;
  border-radius: 12px;
  background: black;
}

#reader video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

#reader__scan_region {
  min-height: 0 !important;
}

#reader__scan_region video {
  object-fit: cover !important;
}

.bagian-barcode {
  flex: 1;
  min-height: 0;
  padding: 14px 4px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bagian-barcode label {
  font-size: 16px;
  font-weight: bold;
}

#hasilBarcode {
  width: 100%;
  padding: 15px;
  font-size: 21px;
  font-weight: bold;
  text-align: center;
  border: 2px solid #176b45;
  border-radius: 10px;
  background: white;
  color: #176b45;
}

#status {
  text-align: center;
  font-size: 14px;
  margin: 5px 0;
}

button {
  width: 100%;
  padding: 15px;
  background: #176b45;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="card">

  <h2>☕ Pemindai Barcode</h2>
  <p>Waroeng Coffee Om Nana</p>

  <div id="reader"></div>

  <div class="bagian-barcode">
    <label>Barcode Terdeteksi</label>

    <input
      type="text"
      id="hasilBarcode"
      placeholder="Menunggu barcode..."
      readonly
    >

    <p id="status">Mengaktifkan kamera...</p>

    <button onclick="tutupPemindai()">TUTUP</button>
  </div>

</div>

<script>
let scanner;
let aktif = false;
let sudahTerbaca = false;

function status(teks) {
  document.getElementById('status').textContent = teks;
}

function mulaiPemindai() {
  scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(function(kamera) {

    if (!kamera || kamera.length === 0) {
      status('Kamera tidak ditemukan.');
      return;
    }

    let kameraBelakang = kamera.find(function(k) {
      return /back|rear|environment|belakang/i.test(k.label);
    });

    let kameraDipilih = kameraBelakang || kamera[0];

    scanner.start(
      kameraDipilih.id,
      {
        fps: 10,
        qrbox: { width: 250, height: 150 },
        aspectRatio: 1.0
      },

      function(barcode) {
        if (sudahTerbaca) return;

        sudahTerbaca = true;

        document.getElementById('hasilBarcode').value = barcode;
        status('Barcode berhasil terdeteksi.');

        scanner.stop().then(function() {
          aktif = false;

          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              tipe: 'HASIL_BARCODE_OM_NANA',
              barcode: barcode
            }, '*');

            window.close();
          } else {
            status('Barcode terbaca. Halaman Tambah Stok tidak ditemukan.');
          }
        });
      },

      function() {
        // Abaikan kegagalan pembacaan sementara.
      }

    ).then(function() {
      aktif = true;
      status('Kamera aktif. Silakan pindai barcode.');
    }).catch(function(error) {
      status('Kamera gagal dibuka: ' + error);
    });

  }).catch(function(error) {
    status('Tidak dapat mengakses kamera: ' + error);
  });
}

function tutupPemindai() {
  if (scanner && aktif) {
    scanner.stop().then(function() {
      aktif = false;
      window.close();
    }).catch(function() {
      window.close();
    });
  } else {
    window.close();
  }
}

window.addEventListener('load', mulaiPemindai);
</script>

</body>
</html>
